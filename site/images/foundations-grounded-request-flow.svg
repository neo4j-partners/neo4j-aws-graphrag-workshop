  <!-- Header -->
  <rect x="30" y="20" width="840" height="56" rx="8" fill="#F5F5F5" stroke="#D6D6D6"/>
  <text x="450" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Follow One Grounded Request</text>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#555555">The model chooses the evidence shape from two read-tool specifications.</text>

  <!-- Question -->
  <rect x="160" y="96" width="580" height="46" rx="8" fill="#F0F0F0" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="450" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">Hotel question</text>
  <line x1="450" y1="142" x2="450" y2="166" stroke="#6E7681" stroke-width="2" marker-end="url(#arrowGrayF)"/>

  <!-- Strands agent -->
  <rect x="160" y="166" width="580" height="70" rx="8" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5" filter="url(#shF)"/>
  <use href="#icon-strandsF" x="182" y="184" width="32" height="32"/>
  <text x="230" y="197" font-size="13.5" font-weight="700" fill="#1A1A1A">Strands agent with plain BedrockModel</text>
  <text x="230" y="216" font-size="11.5" fill="#555555">reads each tool name, description, and input schema</text>

  <!-- Tool selection -->
  <path d="M450,236 V260 H255 V286" fill="none" stroke="#6E7681" stroke-width="2" marker-end="url(#arrowGrayF)"/>
  <path d="M450,260 H645 V286" fill="none" stroke="#6E7681" stroke-width="2" marker-end="url(#arrowGrayF)"/>

  <rect x="70" y="286" width="370" height="82" rx="8" fill="#FFFFFF" stroke="#01A88D" stroke-width="1.5" filter="url(#shF)"/>
  <text x="255" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A" font-family="'SFMono-Regular', Consolas, monospace">search_hotel_passages</text>
  <text x="255" y="330" text-anchor="middle" font-size="10.8" fill="#555555">hybrid search + reviewed traversal</text>
  <use href="#icon-novaF" x="128" y="338" width="20" height="20"/>
  <text x="158" y="353" font-size="10.2" fill="#555555">Nova query embedding; source wording + linked facts</text>

  <rect x="460" y="286" width="370" height="82" rx="8" fill="#FFFFFF" stroke="#D69200" stroke-width="1.5" filter="url(#shF)"/>
  <text x="645" y="311" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A" font-family="'SFMono-Regular', Consolas, monospace">query_hotel_records</text>
  <text x="645" y="330" text-anchor="middle" font-size="10.8" fill="#555555">Text2Cypher for counts, filters, and relationships</text>
  <use href="#icon-bedrockF" x="500" y="338" width="20" height="20"/>
  <text x="530" y="353" font-size="10.2" fill="#555555">nested model call; EXPLAIN allows only a read plan</text>

  <path d="M255,368 V402 H450 V425" fill="none" stroke="#01A88D" stroke-width="2" marker-end="url(#arrowTealF)"/>
  <path d="M645,368 V402 H450 V425" fill="none" stroke="#D69200" stroke-width="2" marker-end="url(#arrowGrayF)"/>

  <!-- Neo4j -->
  <rect x="160" y="425" width="580" height="58" rx="8" fill="#EEF4FB" stroke="#4581C3" stroke-width="1.5"/>
  <use href="#icon-neo4jF" x="180" y="440" width="28" height="28" fill="#4581C3"/>
  <text x="450" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1F4E7A">Neo4j hotel graph and retrieval indexes</text>
  <text x="450" y="468" text-anchor="middle" font-size="10.8" fill="#1F4E7A">returns passage evidence or structured records</text>
  <line x1="450" y1="483" x2="450" y2="520" stroke="#4581C3" stroke-width="2" marker-end="url(#arrowSteelF)"/>

  <!-- Returned context -->
  <rect x="160" y="520" width="580" height="50" rx="8" fill="#F0F0F0" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="450" y="541" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A3A3A">Bounded JSON evidence + shared grounding_result</text>
  <text x="450" y="558" text-anchor="middle" font-size="10.5" fill="#555555">the trace records which tool ran and what it returned</text>
  <line x1="450" y1="570" x2="450" y2="606" stroke="#6E7681" stroke-width="2" marker-end="url(#arrowGrayF)"/>

  <!-- Grounded answer -->
  <rect x="160" y="606" width="580" height="64" rx="8" fill="#232F3E" filter="url(#shF)"/>
  <text x="450" y="633" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">Prompt policy: answer from evidence or state what is missing</text>
  <text x="450" y="653" text-anchor="middle" font-size="10.8" fill="#D5DBE2">the trace shows the model's automatic routing choice</text>
</svg>
