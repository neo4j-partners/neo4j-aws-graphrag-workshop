<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Retrieval patterns in teaching order</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
  </defs>

  <rect x="36" y="28" width="888" height="664" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#sh)"/>

  <g id="diagram-header">
    <text x="64" y="61" fill="#16233A" font-size="19" font-weight="700">Build retrieval one capability at a time</text>
    <text x="64" y="82" fill="#5C6470" font-size="10.5">Each column keeps one entry search and adds a reviewed Cypher traversal beneath it.</text>
  </g>

  <text x="64" y="116" fill="#6B7280" font-size="9" font-weight="700" letter-spacing="0.7">SEARCH FOR MATCHING CHUNKS</text>

  <g id="branch-vector">
    <rect x="64" y="132" width="256" height="118" rx="10" fill="#F3F0FC" stroke="#6B5BD2" stroke-width="1.6"/>
    <circle cx="84" cy="153" r="11" fill="#6B5BD2"/>
    <text x="84" y="157" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <text x="102" y="158" fill="#4B3FA8" font-size="14" font-weight="700">VectorRetriever</text>
    <text x="82" y="183" fill="#3C4450" font-size="10.5">Finds chunks by embedding similarity.</text>
    <text x="82" y="202" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">BEST FOR</text>
    <text x="82" y="218" fill="#3C4450" font-size="10">Paraphrased or semantic source lookup</text>
    <text x="82" y="236" fill="#3C4450" font-size="9.5">Example: “When does arrival processing begin?”</text>
  </g>

  <g id="branch-fulltext">
    <rect x="352" y="132" width="256" height="118" rx="10" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.6"/>
    <circle cx="372" cy="153" r="11" fill="#2E6DB4"/>
    <text x="372" y="157" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">3</text>
    <text x="390" y="158" fill="#1F4E86" font-size="14" font-weight="700">Full-Text Search</text>
    <text x="370" y="183" fill="#3C4450" font-size="10.5">Finds chunks through a Neo4j full-text index.</text>
    <text x="370" y="202" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">BEST FOR</text>
    <text x="370" y="218" fill="#3C4450" font-size="10">Names, identifiers, postal codes, and fuzzy terms</text>
    <text x="370" y="236" fill="#3C4450" font-size="9.5">Example: “Find the policy for ZIP 60611”</text>
  </g>

  <g id="branch-hybrid">
    <rect x="640" y="132" width="256" height="118" rx="10" fill="#E8F6F6" stroke="#14808A" stroke-width="1.6"/>
    <circle cx="660" cy="153" r="11" fill="#14808A"/>
    <text x="660" y="157" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">5</text>
    <text x="678" y="158" fill="#0E5F67" font-size="14" font-weight="700">HybridRetriever</text>
    <text x="658" y="183" fill="#3C4450" font-size="10.5">Fuses vector and full-text result lists.</text>
    <text x="658" y="202" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">BEST FOR</text>
    <text x="658" y="218" fill="#3C4450" font-size="10">Questions needing meaning and exact terms</text>
    <text x="658" y="236" fill="#3C4450" font-size="9.5">Returns ranked chunks and a fused score</text>
  </g>

  <line x1="192" y1="250" x2="192" y2="283" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="250" x2="480" y2="283" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="768" y1="250" x2="768" y2="283" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="64" y="280" fill="#6B7280" font-size="9" font-weight="700" letter-spacing="0.7">ADD CONNECTED GRAPH FACTS</text>

  <g id="branch-vector-cypher">
    <rect x="64" y="294" width="256" height="132" rx="10" fill="#F3F0FC" stroke="#6B5BD2" stroke-width="1.6"/>
    <circle cx="84" cy="315" r="11" fill="#6B5BD2"/>
    <text x="84" y="319" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <text x="102" y="320" fill="#4B3FA8" font-size="13.5" font-weight="700">VectorCypherRetriever</text>
    <text x="82" y="345" fill="#3C4450" font-size="10.5">Vector search selects each starting Chunk.</text>
    <text x="82" y="361" fill="#3C4450" font-size="10.5">Reviewed Cypher adds related graph facts.</text>
    <text x="82" y="383" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">NEO4J PATTERN</text>
    <text x="82" y="399" fill="#3C4450" font-size="10">Graph-Enhanced Vector Search</text>
    <text x="82" y="416" fill="#3C4450" font-size="9.5">Returns chunks, properties, and provenance</text>
  </g>

  <g id="branch-fulltext-cypher">
    <rect x="352" y="294" width="256" height="132" rx="10" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.6"/>
    <circle cx="372" cy="315" r="11" fill="#2E6DB4"/>
    <text x="372" y="319" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">4</text>
    <text x="390" y="320" fill="#1F4E86" font-size="13.5" font-weight="700">Full-Text + Cypher</text>
    <text x="370" y="345" fill="#3C4450" font-size="10.5">Full-text search selects each starting Chunk.</text>
    <text x="370" y="361" fill="#3C4450" font-size="10.5">Reviewed Cypher adds related graph facts.</text>
    <text x="370" y="383" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">IMPLEMENTATION</text>
    <text x="370" y="399" fill="#3C4450" font-size="10">Parameterized query or custom retriever</text>
    <text x="370" y="416" fill="#3C4450" font-size="9.5">No separate class name in this Python version</text>
  </g>

  <g id="branch-hybrid-cypher">
    <rect x="640" y="294" width="256" height="132" rx="10" fill="#E8F6F6" stroke="#14808A" stroke-width="1.6"/>
    <circle cx="660" cy="315" r="11" fill="#14808A"/>
    <text x="660" y="319" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">6</text>
    <text x="678" y="320" fill="#0E5F67" font-size="13.5" font-weight="700">HybridCypherRetriever</text>
    <text x="658" y="345" fill="#3C4450" font-size="10.5">Hybrid search selects each starting Chunk.</text>
    <text x="658" y="361" fill="#3C4450" font-size="10.5">Reviewed Cypher adds related graph facts.</text>
    <text x="658" y="383" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">WORKSHOP CHOICE</text>
    <text x="658" y="399" fill="#3C4450" font-size="10">Exact names, meaning, and connected fields</text>
    <text x="658" y="416" fill="#3C4450" font-size="9.5">Used by search_hotel_knowledge</text>
  </g>

  <line x1="480" y1="426" x2="480" y2="465" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="64" y="462" fill="#6B7280" font-size="9" font-weight="700" letter-spacing="0.7">QUERY THE DOMAIN GRAPH DIRECTLY</text>

  <g id="branch-fixed-cypher">
    <rect x="128" y="478" width="328" height="142" rx="10" fill="#FDF3E6" stroke="#C1741C" stroke-width="1.6"/>
    <circle cx="150" cy="500" r="11" fill="#C1741C"/>
    <text x="150" y="504" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">7</text>
    <text x="170" y="505" fill="#8F5313" font-size="14" font-weight="700">Cypher Templates</text>
    <text x="148" y="531" fill="#3C4450" font-size="10.5">Run a reviewed, parameterized query for a</text>
    <text x="148" y="547" fill="#3C4450" font-size="10.5">known structured question shape.</text>
    <text x="148" y="571" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EXAMPLE</text>
    <text x="148" y="588" fill="#3C4450" font-size="10">Chicago hotels with a spa and swimming pool</text>
    <text x="148" y="606" fill="#3C4450" font-size="9.5">Returns candidates, qualifiers, and exclusions</text>
  </g>

  <g id="optional-text2cypher">
    <rect x="504" y="478" width="328" height="142" rx="10" fill="#FDF9F3" stroke="#C1741C" stroke-width="1.6" stroke-dasharray="6 4"/>
    <circle cx="526" cy="500" r="11" fill="#C1741C"/>
    <text x="526" y="504" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">8</text>
    <text x="546" y="505" fill="#8F5313" font-size="14" font-weight="700">Text2CypherRetriever</text>
    <text x="524" y="531" fill="#3C4450" font-size="10.5">Generate Cypher from the question and graph</text>
    <text x="524" y="547" fill="#3C4450" font-size="10.5">schema for a flexible structured question.</text>
    <text x="524" y="571" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">REQUIRES</text>
    <text x="524" y="588" fill="#3C4450" font-size="10">Schema, examples, validation, and read-only access</text>
    <text x="524" y="606" fill="#3C4450" font-size="9.5">Optional because generated queries can fail</text>
  </g>

  <g id="knowledge-graph">
    <rect x="230" y="646" width="500" height="30" rx="9" fill="#16233A"/>
    <text x="480" y="666" fill="#FFFFFF" font-size="11.5" font-weight="700" text-anchor="middle">All eight paths read the same Neo4j knowledge graph</text>
  </g>
</svg>
