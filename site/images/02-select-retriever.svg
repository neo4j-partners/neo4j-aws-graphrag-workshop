<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Choose a retrieval pattern by question shape</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
    <marker id="aPurple" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B5BD2"/>
    </marker>
    <marker id="aBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2E6DB4"/>
    </marker>
    <marker id="aTeal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#14808A"/>
    </marker>
    <marker id="aAmber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C1741C"/>
    </marker>
  </defs>

  <!-- White card -->
  <rect x="40" y="32" width="880" height="576" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#sh)"/>

  <!-- ============ HEADER ============ -->
  <g id="diagram-header">
    <text x="64" y="62" fill="#16233A" font-size="19" font-weight="700">Choose a retrieval pattern by question shape</text>
    <text x="64" y="82" fill="#5C6470" font-size="10.5">The shape of the question selects the retriever. Every path reads the same Neo4j graph.</text>
  </g>

  <!-- ============ START ============ -->
  <g id="start-question">
    <rect x="280" y="96" width="400" height="46" rx="10" fill="#16233A"/>
    <text x="480" y="114" fill="#A9B4C4" font-size="8" font-weight="700" letter-spacing="0.6" text-anchor="middle">START</text>
    <text x="480" y="132" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">What evidence does the question need?</text>
  </g>

  <!-- fan out to the four branches -->
  <line x1="480" y1="142" x2="164" y2="168" stroke="#6B5BD2" stroke-width="1.6" marker-end="url(#aPurple)"/>
  <line x1="480" y1="142" x2="375" y2="168" stroke="#2E6DB4" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <line x1="480" y1="142" x2="586" y2="168" stroke="#14808A" stroke-width="1.6" marker-end="url(#aTeal)"/>
  <line x1="480" y1="142" x2="797" y2="168" stroke="#C1741C" stroke-width="1.6" marker-end="url(#aAmber)"/>

  <!-- ============ BRANCH 1: VECTOR ============ -->
  <g id="branch-vector">
    <rect x="64" y="172" width="200" height="42" rx="9" fill="#E2DBF8" stroke="#6B5BD2" stroke-width="1.4"/>
    <text x="164" y="193" fill="#4B3FA8" font-size="10.5" font-weight="700" text-anchor="middle">Semantic or paraphrased</text>
    <text x="164" y="206" fill="#4B3FA8" font-size="10.5" font-weight="700" text-anchor="middle">source lookup</text>
    <line x1="164" y1="214" x2="164" y2="234" stroke="#6B5BD2" stroke-width="1.6" marker-end="url(#aPurple)"/>

    <rect x="64" y="236" width="200" height="226" rx="10" fill="#F3F0FC" stroke="#6B5BD2" stroke-width="1.6"/>
    <text x="164" y="264" fill="#4B3FA8" font-size="13.5" font-weight="700" text-anchor="middle">VectorRetriever</text>
    <line x1="78" y1="275" x2="250" y2="275" stroke="#6B5BD2" stroke-opacity="0.35" stroke-width="1"/>
    <text x="78" y="296" fill="#3C4450" font-size="10">Embedding similarity over</text>
    <text x="78" y="309" fill="#3C4450" font-size="10">Chunk text</text>
    <text x="78" y="361" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EVIDENCE</text>
    <text x="78" y="375" fill="#3C4450" font-size="10">Ranked source Chunks and</text>
    <text x="78" y="388" fill="#3C4450" font-size="10">scores</text>
    <text x="78" y="414" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EXAMPLE</text>
    <text x="78" y="428" fill="#3C4450" font-size="10">When does arrival</text>
    <text x="78" y="441" fill="#3C4450" font-size="10">processing begin?</text>
  </g>

  <!-- ============ BRANCH 2: HYBRID ============ -->
  <g id="branch-hybrid">
    <rect x="275" y="172" width="200" height="42" rx="9" fill="#D9E7F6" stroke="#2E6DB4" stroke-width="1.4"/>
    <text x="375" y="193" fill="#1F4E86" font-size="10.5" font-weight="700" text-anchor="middle">Exact name, code,</text>
    <text x="375" y="206" fill="#1F4E86" font-size="10.5" font-weight="700" text-anchor="middle">or identifier</text>
    <line x1="375" y1="214" x2="375" y2="234" stroke="#2E6DB4" stroke-width="1.6" marker-end="url(#aBlue)"/>

    <rect x="275" y="236" width="200" height="226" rx="10" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.6"/>
    <text x="375" y="264" fill="#1F4E86" font-size="13.5" font-weight="700" text-anchor="middle">HybridRetriever</text>
    <line x1="289" y1="275" x2="461" y2="275" stroke="#2E6DB4" stroke-opacity="0.35" stroke-width="1"/>
    <text x="289" y="296" fill="#3C4450" font-size="10">Vector plus full-text</text>
    <text x="289" y="309" fill="#3C4450" font-size="10">relevance</text>
    <text x="289" y="361" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EVIDENCE</text>
    <text x="289" y="375" fill="#3C4450" font-size="10">Semantic score and</text>
    <text x="289" y="388" fill="#3C4450" font-size="10">exact-term hits</text>
    <text x="289" y="414" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EXAMPLE</text>
    <text x="289" y="428" fill="#3C4450" font-size="10">Find the policy for ZIP</text>
    <text x="289" y="441" fill="#3C4450" font-size="10">60611</text>
  </g>

  <!-- ============ BRANCH 3: VECTOR-CYPHER ============ -->
  <g id="branch-vector-cypher">
    <rect x="486" y="172" width="200" height="42" rx="9" fill="#CFEDED" stroke="#14808A" stroke-width="1.4"/>
    <text x="586" y="193" fill="#0E5F67" font-size="10.5" font-weight="700" text-anchor="middle">Semantic match plus</text>
    <text x="586" y="206" fill="#0E5F67" font-size="10.5" font-weight="700" text-anchor="middle">connected facts</text>
    <line x1="586" y1="214" x2="586" y2="234" stroke="#14808A" stroke-width="1.6" marker-end="url(#aTeal)"/>

    <rect x="486" y="236" width="200" height="226" rx="10" fill="#E8F6F6" stroke="#14808A" stroke-width="1.6"/>
    <text x="586" y="264" fill="#0E5F67" font-size="13.5" font-weight="700" text-anchor="middle">VectorCypherRetriever</text>
    <line x1="500" y1="275" x2="672" y2="275" stroke="#14808A" stroke-opacity="0.35" stroke-width="1"/>
    <text x="500" y="296" fill="#3C4450" font-size="10">Semantic match finds a Chunk</text>
    <text x="500" y="309" fill="#3C4450" font-size="10">node, reviewed traversal</text>
    <text x="500" y="322" fill="#3C4450" font-size="10">expands the graph, and named</text>
    <text x="500" y="335" fill="#3C4450" font-size="10">fields include provenance</text>
    <text x="500" y="361" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EVIDENCE</text>
    <text x="500" y="375" fill="#3C4450" font-size="10">Named fields with source</text>
    <text x="500" y="388" fill="#3C4450" font-size="10">provenance</text>
    <text x="500" y="414" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EXAMPLE</text>
    <text x="500" y="428" fill="#3C4450" font-size="10">Amenities and rating for</text>
    <text x="500" y="441" fill="#3C4450" font-size="10">the Cairo hotel</text>
  </g>

  <!-- ============ BRANCH 4: FIXED CYPHER ============ -->
  <g id="branch-fixed-cypher">
    <rect x="697" y="172" width="200" height="42" rx="9" fill="#FAE3C8" stroke="#C1741C" stroke-width="1.4"/>
    <text x="797" y="193" fill="#8F5313" font-size="10.5" font-weight="700" text-anchor="middle">Reviewed structured</text>
    <text x="797" y="206" fill="#8F5313" font-size="10.5" font-weight="700" text-anchor="middle">filtering</text>
    <line x1="797" y1="214" x2="797" y2="234" stroke="#C1741C" stroke-width="1.6" marker-end="url(#aAmber)"/>

    <rect x="697" y="236" width="200" height="226" rx="10" fill="#FDF3E6" stroke="#C1741C" stroke-width="1.6"/>
    <text x="797" y="264" fill="#8F5313" font-size="13.5" font-weight="700" text-anchor="middle">Reviewed fixed Cypher</text>
    <line x1="711" y1="275" x2="883" y2="275" stroke="#C1741C" stroke-opacity="0.35" stroke-width="1"/>
    <text x="711" y="296" fill="#3C4450" font-size="10">Application-owned query over</text>
    <text x="711" y="309" fill="#3C4450" font-size="10">named fields and relationships</text>
    <text x="711" y="361" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EVIDENCE</text>
    <text x="711" y="375" fill="#3C4450" font-size="10">Reviewed Cypher and</text>
    <text x="711" y="388" fill="#3C4450" font-size="10">database records</text>
    <text x="711" y="414" fill="#6B7280" font-size="8" font-weight="700" letter-spacing="0.6">EXAMPLE</text>
    <text x="711" y="428" fill="#3C4450" font-size="10">Chicago hotels with a spa</text>
    <text x="711" y="441" fill="#3C4450" font-size="10">and pool</text>
  </g>

  <!-- ============ CONVERGE ON THE GRAPH ============ -->
  <line x1="164" y1="462" x2="418" y2="487" stroke="#6B5BD2" stroke-width="1.6" marker-end="url(#aPurple)"/>
  <line x1="375" y1="462" x2="459" y2="487" stroke="#2E6DB4" stroke-width="1.6" marker-end="url(#aBlue)"/>
  <line x1="586" y1="462" x2="501" y2="487" stroke="#14808A" stroke-width="1.6" marker-end="url(#aTeal)"/>
  <line x1="797" y1="462" x2="542" y2="487" stroke="#C1741C" stroke-width="1.6" marker-end="url(#aAmber)"/>

  <g id="knowledge-graph">
    <rect x="230" y="490" width="500" height="46" rx="10" fill="#2E6DB4" stroke="#1F4E86" stroke-width="1.6"/>
    <text x="480" y="512" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Neo4j Knowledge Graph</text>
    <text x="480" y="527" fill="#DEEAF6" font-size="9.5" text-anchor="middle">Source Chunks, named entities, and connected facts</text>
  </g>

  <!-- ============ OPTIONAL EXTENSION ============ -->
  <g id="optional-text2cypher">
    <rect x="64" y="550" width="833" height="44" rx="10" fill="#FDF9F3" stroke="#C1741C" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="82" y="570" fill="#8F5313" font-size="8" font-weight="700" letter-spacing="0.6">OPTIONAL EXTENSION</text>
    <text x="82" y="585" fill="#3C4450" font-size="10">Text2CypherRetriever generates read-only Cypher for flexible questions. It is planned with EXPLAIN and runs only when Neo4j reports it read-only.</text>
  </g>
</svg>
