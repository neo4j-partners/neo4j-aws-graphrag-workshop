<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>One document becomes two connected layers</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2E6DB4"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A8A8A"/>
    </marker>
  </defs>

  <!-- White card -->
  <rect x="40" y="32" width="880" height="484" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#sh)"/>

  <!-- ============ HEADER ============ -->
  <text x="64" y="62" fill="#16233A" font-size="20" font-weight="700">One document becomes two connected layers</text>
  <text x="64" y="82" fill="#16233A" font-size="10.5">Every domain relationship starts at Hotel, so each document produces a one-hop star of facts.</text>

  <!-- ============ SOURCE FILE ============ -->
  <rect x="380" y="96" width="200" height="38" rx="9" fill="#F1F1EE" stroke="#DAD7CE"/>
  <text x="480" y="115" fill="#16233A" font-size="10" font-weight="700" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">hotel-tokyo-002.txt</text>
  <text x="480" y="127" fill="#5C6470" font-size="7.5" text-anchor="middle">one source file, about 7 KB of text</text>

  <line x1="480" y1="134" x2="480" y2="152" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#arrowGray)"/>
  <text x="492" y="147" fill="#5C6470" font-size="7.5">the build reads it</text>

  <!-- ============ LEXICAL LAYER ============ -->
  <rect x="64" y="152" width="832" height="150" rx="12" fill="#EEF4FB" stroke="#6E86CF"/>
  <text x="80" y="170" fill="#1F4E86" font-size="7.5" font-weight="700" letter-spacing="0.4">THE LEXICAL LAYER: THE TEXT</text>
  <text x="880" y="170" fill="#5C6470" font-size="7.5" text-anchor="end">vector search and keyword search read this layer</text>

  <rect x="380" y="180" width="200" height="42" rx="10" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.6"/>
  <text x="480" y="199" fill="#1F4E86" font-size="11" font-weight="700" text-anchor="middle">(:Document)</text>
  <text x="480" y="213" fill="#5C6470" font-size="7.5" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">source_filename: "hotel-tokyo-002.txt"</text>

  <line x1="480" y1="246" x2="480" y2="224" stroke="#2E6DB4" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="492" y="239" fill="#5C6470" font-size="7.5" font-weight="700" letter-spacing="0.2">FROM_DOCUMENT</text>

  <rect x="370" y="246" width="220" height="46" rx="10" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.6"/>
  <text x="480" y="266" fill="#1F4E86" font-size="11" font-weight="700" text-anchor="middle">(:Chunk)</text>
  <text x="480" y="281" fill="#5C6470" font-size="7.5" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">text · embedding: 1024 floats</text>

  <!-- ============ DOMAIN LAYER ============ -->
  <rect x="64" y="310" width="832" height="190" rx="12" fill="#EEF4FB" stroke="#6E86CF"/>
  <text x="80" y="328" fill="#1F4E86" font-size="7.5" font-weight="700" letter-spacing="0.4">THE DOMAIN LAYER: THE FACTS</text>
  <text x="880" y="328" fill="#5C6470" font-size="7.5" text-anchor="end">Cypher queries read this layer</text>

  <rect x="330" y="340" width="300" height="48" rx="10" fill="#2E6DB4" stroke="#1F4E86" stroke-width="1.6"/>
  <text x="480" y="362" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">(:Hotel)</text>
  <text x="480" y="377" fill="#DEEAF6" font-size="7.5" text-anchor="middle" font-family="'SF Mono',Menlo,monospace">name · address · guest_rating · total_rooms · email · phone</text>

  <!-- the join between the two layers -->
  <line x1="480" y1="338" x2="480" y2="296" stroke="#2E6DB4" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="492" y="320" fill="#5C6470" font-size="7.5" font-weight="700" letter-spacing="0.2">FROM_CHUNK</text>

  <!-- the one-hop star -->
  <g stroke="#2E6DB4" stroke-width="1.6" fill="none">
    <line x1="480" y1="388" x2="165" y2="438" marker-end="url(#arrowBlue)"/>
    <line x1="480" y1="388" x2="375" y2="438" marker-end="url(#arrowBlue)"/>
    <line x1="480" y1="388" x2="585" y2="438" marker-end="url(#arrowBlue)"/>
    <line x1="480" y1="388" x2="795" y2="438" marker-end="url(#arrowBlue)"/>
  </g>

  <g>
    <rect x="75" y="440" width="180" height="48" rx="10" fill="#DEEAF6" stroke="#2E6DB4" stroke-width="1.4"/>
    <text x="165" y="459" fill="#5C6470" font-size="7.5" font-weight="700" letter-spacing="0.3" text-anchor="middle">HAS_ROOM</text>
    <text x="165" y="476" fill="#1F4E86" font-size="11" font-weight="700" text-anchor="middle">(:Room)</text>
  </g>
  <g>
    <rect x="285" y="440" width="180" height="48" rx="10" fill="#DEEAF6" stroke="#2E6DB4" stroke-width="1.4"/>
    <text x="375" y="459" fill="#5C6470" font-size="7.5" font-weight="700" letter-spacing="0.3" text-anchor="middle">OFFERS_AMENITY</text>
    <text x="375" y="476" fill="#1F4E86" font-size="11" font-weight="700" text-anchor="middle">(:Amenity)</text>
  </g>
  <g>
    <rect x="495" y="440" width="180" height="48" rx="10" fill="#DEEAF6" stroke="#2E6DB4" stroke-width="1.4"/>
    <text x="585" y="459" fill="#5C6470" font-size="7.5" font-weight="700" letter-spacing="0.3" text-anchor="middle">HAS_POLICY</text>
    <text x="585" y="476" fill="#1F4E86" font-size="11" font-weight="700" text-anchor="middle">(:Policy)</text>
  </g>
  <g>
    <rect x="705" y="440" width="180" height="48" rx="10" fill="#DEEAF6" stroke="#2E6DB4" stroke-width="1.4"/>
    <text x="795" y="459" fill="#5C6470" font-size="7.5" font-weight="700" letter-spacing="0.3" text-anchor="middle">PROVIDES_SERVICE</text>
    <text x="795" y="476" fill="#1F4E86" font-size="11" font-weight="700" text-anchor="middle">(:Service)</text>
  </g>
</svg>
