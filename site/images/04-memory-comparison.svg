  <!-- Header -->
  <rect x="30" y="20" width="1590" height="62" rx="8" fill="#F5F5F5" stroke="#D6D6D6"/>
  <text x="825" y="46" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A">Module 6: Two Approaches to Long-Term Preference Memory</text>
  <text x="825" y="68" text-anchor="middle" font-size="12.5" fill="#555555">AgentCore Memory and Neo4j graph memory both extend a Bedrock AgentCore agent. They differ in where facts live and how you inspect them.</text>

  <!-- AWS Cloud outline -->
  <rect x="50" y="100" width="1380" height="620" rx="12" fill="none" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="66" y="122" font-size="12" font-weight="700" fill="#232F3E" letter-spacing="0.5">AWS CLOUD &#183; US-EAST-1</text>

  <!-- Left container: AgentCore Memory -->
  <rect x="80" y="140" width="650" height="560" rx="10" fill="#F6FDFC" stroke="#01A88D" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="405" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#01A88D" letter-spacing="0.5">WITH AGENTCORE MEMORY</text>

  <!-- Right container: Neo4j graph memory -->
  <rect x="760" y="140" width="650" height="560" rx="10" fill="#EFF5FB" stroke="#4581C3" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1085" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#4581C3" letter-spacing="0.5">WITH NEO4J GRAPH MEMORY</text>

  <!-- Left: User -->
  <rect x="115" y="185" width="90" height="90" rx="8" fill="#232F3E" filter="url(#shM6)"/>
  <use href="#icon-user" x="137" y="205" width="46" height="46" fill="#FFFFFF"/>
  <text x="160" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#232F3E">User</text>

  <!-- Left: Runtime -->
  <rect x="250" y="180" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#01A88D" stroke-width="1.5" filter="url(#shM6)"/>
  <use href="#icon-agentcore" x="330" y="192" width="30" height="30"/>
  <text x="345" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">Amazon Bedrock</text>
  <text x="345" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">AgentCore Runtime</text>

  <!-- Left: Memory -->
  <rect x="490" y="180" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#01A88D" stroke-width="1.5" filter="url(#shM6)"/>
  <use href="#icon-agentcore" x="570" y="192" width="30" height="30"/>
  <text x="585" y="245" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">AgentCore Memory</text>

  <!-- Left arrows -->
  <line x1="205" y1="230" x2="248" y2="230" stroke="#1A73E8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBlueDashedM6)"/>
  <text x="227" y="222" text-anchor="middle" font-size="10.5" fill="#1A73E8" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">invoke</text>

  <line x1="440" y1="230" x2="488" y2="230" stroke="#ED7100" stroke-width="2" marker-end="url(#arrowOrangeM6)"/>
  <text x="464" y="222" text-anchor="middle" font-size="10.5" fill="#ED7100" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">store preference</text>

  <line x1="585" y1="280" x2="585" y2="328" stroke="#01A88D" stroke-width="2" marker-end="url(#arrowOrangeM6)"/>

  <!-- Left: managed extraction description -->
  <rect x="115" y="330" width="580" height="320" rx="10" fill="#FFF6EA" stroke="#B7791F" stroke-width="1.5"/>
  <text x="405" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#8A5A12">Managed extraction</text>
  <text x="405" y="404" text-anchor="middle" font-size="12.5" fill="#3A3A3A">An LLM extracts preferences from the conversation</text>
  <text x="405" y="424" text-anchor="middle" font-size="12.5" fill="#3A3A3A">asynchronously, on the order of seconds to minutes.</text>
  <text x="405" y="460" text-anchor="middle" font-size="12.5" fill="#3A3A3A">Recall and correction go through the Memory API,</text>
  <text x="405" y="480" text-anchor="middle" font-size="12.5" fill="#3A3A3A">and provenance is available in CloudWatch operational logs.</text>
  <text x="405" y="516" text-anchor="middle" font-size="12.5" fill="#3A3A3A">Preferences are stored inside the managed service,</text>
  <text x="405" y="536" text-anchor="middle" font-size="12.5" fill="#3A3A3A">separate from the rest of the domain graph.</text>

  <!-- Right: User -->
  <rect x="795" y="185" width="90" height="90" rx="8" fill="#232F3E" filter="url(#shM6)"/>
  <use href="#icon-user" x="817" y="205" width="46" height="46" fill="#FFFFFF"/>
  <text x="840" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#232F3E">User</text>

  <!-- Right: Runtime -->
  <rect x="930" y="180" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#01A88D" stroke-width="1.5" filter="url(#shM6)"/>
  <use href="#icon-agentcore" x="1010" y="192" width="30" height="30"/>
  <text x="1025" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">Amazon Bedrock</text>
  <text x="1025" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">AgentCore Runtime</text>

  <!-- Right: Lambda -->
  <rect x="1170" y="180" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5" filter="url(#shM6)"/>
  <use href="#icon-lambda" x="1250" y="192" width="30" height="30"/>
  <text x="1265" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1A1A1A">AWS Lambda</text>
  <text x="1265" y="254" text-anchor="middle" font-size="11.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#555555">memory_writer</text>

  <!-- Right arrows -->
  <line x1="885" y1="230" x2="928" y2="230" stroke="#1A73E8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBlueDashedM6)"/>
  <text x="907" y="222" text-anchor="middle" font-size="10.5" fill="#1A73E8" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">invoke</text>

  <line x1="1120" y1="230" x2="1168" y2="230" stroke="#ED7100" stroke-width="2" marker-end="url(#arrowOrangeM6)"/>
  <text x="1144" y="222" text-anchor="middle" font-size="10.5" fill="#ED7100" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">store preference</text>

  <!-- Right: graph excerpt -->
  <line x1="1085" y1="388" x2="955" y2="432" stroke="#5E35B1" stroke-width="2"/>
  <text x="1000" y="404" text-anchor="middle" font-size="10" font-family="'SFMono-Regular', Consolas, monospace" fill="#5E35B1" stroke="#EFF5FB" stroke-width="3" paint-order="stroke">DERIVED_FROM</text>

  <line x1="1085" y1="388" x2="1215" y2="432" stroke="#5E35B1" stroke-width="2"/>
  <text x="1170" y="404" text-anchor="middle" font-size="10" font-family="'SFMono-Regular', Consolas, monospace" fill="#5E35B1" stroke="#EFF5FB" stroke-width="3" paint-order="stroke">ABOUT_HOTEL</text>

  <circle cx="1085" cy="360" r="30" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="1085" y="365" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4527A0">Preference</text>

  <circle cx="955" cy="460" r="30" fill="#F0F0F0" stroke="#757575" stroke-width="1.5"/>
  <text x="955" y="465" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3A3A3A">Message</text>

  <circle cx="1215" cy="460" r="30" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="1215" y="465" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8A4A00">Hotel</text>

  <!-- Right: explicit graph writes description -->
  <rect x="795" y="505" width="580" height="145" rx="10" fill="#EEF4FB" stroke="#2E6DB4" stroke-width="1.5"/>
  <text x="1085" y="533" text-anchor="middle" font-size="15" font-weight="700" fill="#1F4E7A">Explicit graph writes</text>
  <text x="1085" y="562" text-anchor="middle" font-size="12.5" fill="#3A3A3A">The Lambda writes each preference synchronously, as a graph</text>
  <text x="1085" y="582" text-anchor="middle" font-size="12.5" fill="#3A3A3A">node connected to its source message and the hotel it concerns.</text>
  <text x="1085" y="612" text-anchor="middle" font-size="12.5" fill="#3A3A3A">Recall is a Cypher match; correction is a direct SET on the</text>
  <text x="1085" y="632" text-anchor="middle" font-size="12.5" fill="#3A3A3A">property, alongside the rest of the domain data.</text>

  <!-- Neo4j Aura (outside AWS Cloud) -->
  <path d="M1450,360 a90,18 0 0,0 180,0 v140 a90,18 0 0,1 -180,0 z" fill="#DAE8FC" stroke="#4581C3" stroke-width="2"/>
  <ellipse cx="1540" cy="360" rx="90" ry="18" fill="#DAE8FC" stroke="#4581C3" stroke-width="2"/>
