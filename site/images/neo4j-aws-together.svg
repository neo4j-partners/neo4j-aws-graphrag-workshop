<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>A grounded request crosses AWS agent services and the Neo4j knowledge layer</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a1a1a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4581C3"/>
    </marker>
  </defs>

  <rect x="25" y="20" width="950" height="460" rx="18" fill="#ffffff" stroke="#dedede"/>
  <text x="50" y="55" font-size="22" font-weight="700" fill="#16233A">Neo4j + AWS: one grounded agent system</text>
  <text x="50" y="78" font-size="12" fill="#5C6470">AWS runs the intelligence and application path. Neo4j supplies connected, traceable knowledge.</text>

  <rect x="50" y="110" width="170" height="105" rx="12" fill="#F5F5F5" stroke="#8A8A8A" filter="url(#shadow)"/>
  <text x="135" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">User or application</text>
  <text x="135" y="171" text-anchor="middle" font-size="11" fill="#5C6470">question</text>
  <text x="135" y="190" text-anchor="middle" font-size="11" fill="#5C6470">reservation command</text>

  <rect x="285" y="100" width="370" height="230" rx="16" fill="#FFF7ED" stroke="#ED7100" stroke-width="2"/>
  <text x="310" y="130" font-size="17" font-weight="700" fill="#8C4300">AWS agent and application layer</text>

  <rect x="310" y="150" width="145" height="70" rx="10" fill="#FFFFFF" stroke="#01A88D" filter="url(#shadow)"/>
  <text x="382" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0D5C54">Strands + Bedrock</text>
  <text x="382" y="199" text-anchor="middle" font-size="10.5" fill="#5C6470">reason and select tools</text>

  <rect x="485" y="150" width="145" height="70" rx="10" fill="#FFFFFF" stroke="#01A88D" filter="url(#shadow)"/>
  <text x="557" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0D5C54">AgentCore</text>
  <text x="557" y="199" text-anchor="middle" font-size="10.5" fill="#5C6470">Gateway or Runtime</text>

  <rect x="310" y="245" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#ED7100" filter="url(#shadow)"/>
  <text x="470" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#8C4300">Lambda · IAM · Secrets · CloudWatch</text>
  <text x="470" y="291" text-anchor="middle" font-size="10.5" fill="#5C6470">execute, authorize, protect, and observe</text>

  <rect x="720" y="100" width="230" height="230" rx="16" fill="#EEF4FB" stroke="#4581C3" stroke-width="2"/>
  <text x="745" y="130" font-size="17" font-weight="700" fill="#1F4E7A">Neo4j knowledge layer</text>
  <text x="745" y="165" font-size="12" font-weight="700" fill="#1F4E7A">AuraDB property graph</text>
  <text x="745" y="190" font-size="11" fill="#3A6EA5">vector + full-text indexes</text>
  <text x="745" y="213" font-size="11" fill="#3A6EA5">Cypher traversal + rules</text>
  <text x="745" y="236" font-size="11" fill="#3A6EA5">source provenance</text>
  <text x="745" y="259" font-size="11" fill="#3A6EA5">graph memory</text>
  <rect x="745" y="280" width="180" height="30" rx="8" fill="#4581C3"/>
  <text x="835" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">connected evidence</text>

  <line x1="220" y1="162" x2="283" y2="162" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="251" y="148" text-anchor="middle" font-size="10" fill="#59636e">request</text>

  <line x1="655" y1="190" x2="718" y2="190" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="686" y="176" text-anchor="middle" font-size="10" fill="#59636e">driver / MCP</text>

  <line x1="718" y1="245" x2="655" y2="245" stroke="#4581C3" stroke-width="2" marker-end="url(#arrowBack)"/>
  <text x="686" y="265" text-anchor="middle" font-size="10" fill="#1F4E7A">evidence</text>

  <rect x="50" y="375" width="900" height="75" rx="12" fill="#232F3E"/>
  <text x="500" y="405" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">The shared outcome</text>
  <text x="500" y="430" text-anchor="middle" font-size="12" fill="#D5DBE2">Answers grounded in connected evidence · writes protected by application and database controls · memory linked to its source</text>
</svg>
