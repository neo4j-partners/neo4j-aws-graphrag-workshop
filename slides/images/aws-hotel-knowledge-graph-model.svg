<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Hotel GraphRAG Storage Model</title>
  <desc>One Neo4j knowledge graph connects a lexical text layer to a hotel domain layer.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A1A1A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2E6DB4"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0F857B"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#F7F8FA"/>

  <!-- Slide title -->
  <text x="480" y="38" fill="#16233A" font-size="22" font-weight="700" text-anchor="middle">Hotel GraphRAG Storage Model</text>
  <text x="480" y="58" fill="#5C6470" font-size="10.5" text-anchor="middle">One Neo4j graph keeps searchable text, source provenance, and connected hotel facts together.</text>

  <!-- One graph container -->
  <rect x="40" y="78" width="880" height="434" rx="16" fill="#FFFFFF" stroke="#E7E4DB" filter="url(#shadow)"/>
  <path d="M40,120 V94 A16,16 0 0 1 56,78 H904 A16,16 0 0 1 920,94 V120 Z" fill="#018BFF"/>
  <path d="M64,92 L70,98 L64,104 L58,98 Z" fill="#FFFFFF"/>
  <text x="80" y="103" fill="#FFFFFF" font-size="13" font-weight="700">Neo4j knowledge graph</text>
  <text x="896" y="102" fill="#E8F4FF" font-size="8.5" text-anchor="end">one connected storage and retrieval model</text>

  <!-- Lexical layer -->
  <rect x="60" y="134" width="840" height="166" rx="12" fill="#FFFAEC" stroke="#D4A017" stroke-width="1.2"/>
  <text x="78" y="153" fill="#92660A" font-size="8" font-weight="700" letter-spacing="0.5">LEXICAL LAYER: SEARCHABLE TEXT</text>
  <text x="882" y="153" fill="#8A7440" font-size="8" text-anchor="end">vector and keyword retrieval enter through Chunk</text>

  <!-- Lexical index cards -->
  <rect x="82" y="169" width="244" height="50" rx="10" fill="#E8F7F5" stroke="#0F857B" stroke-width="1.3"/>
  <text x="96" y="188" fill="#0F6F66" font-size="10.5" font-weight="700">Vector index</text>
  <text x="96" y="203" fill="#386E69" font-size="7.7">cosine similarity over Chunk.embedding</text>
  <text x="96" y="213" fill="#386E69" font-size="6.8">Amazon Nova 2 Multimodal Embeddings on Amazon Bedrock, 1024d</text>

  <rect x="82" y="231" width="244" height="44" rx="10" fill="#E8F7F5" stroke="#0F857B" stroke-width="1.3"/>
  <text x="96" y="249" fill="#0F6F66" font-size="10.5" font-weight="700">Full-text index</text>
  <text x="96" y="264" fill="#386E69" font-size="7.7">Lucene keyword search over Chunk.text</text>

  <!-- Lexical nodes and relationships -->
  <line x1="326" y1="194" x2="385" y2="216" stroke="#0F857B" stroke-width="1.6" marker-end="url(#arrow-teal)"/>
  <line x1="326" y1="253" x2="385" y2="231" stroke="#0F857B" stroke-width="1.6" marker-end="url(#arrow-teal)"/>
  <text x="349" y="185" fill="#0F6F66" font-size="7" font-weight="700">INDEXES</text>

  <rect x="390" y="191" width="190" height="62" rx="11" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.6"/>
  <text x="485" y="214" fill="#6B4E07" font-size="12" font-weight="700" text-anchor="middle">(:Chunk)</text>
  <text x="485" y="231" fill="#8A7440" font-size="8" text-anchor="middle" font-family="Menlo, monospace">text</text>
  <text x="485" y="244" fill="#8A7440" font-size="8" text-anchor="middle" font-family="Menlo, monospace">embedding: 1024 floats</text>

  <line x1="584" y1="222" x2="665" y2="222" stroke="#2E6DB4" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="587" y="199" width="76" height="15" rx="7.5" fill="#FFFFFF"/>
  <text x="625" y="209.5" fill="#1F4E86" font-size="6.8" font-weight="700" text-anchor="middle">FROM_DOCUMENT</text>

  <rect x="670" y="191" width="190" height="62" rx="11" fill="#FFFFFF" stroke="#D4A017" stroke-width="1.6"/>
  <text x="765" y="216" fill="#6B4E07" font-size="12" font-weight="700" text-anchor="middle">(:Document)</text>
  <text x="765" y="237" fill="#8A7440" font-size="8" text-anchor="middle" font-family="Menlo, monospace">source_filename</text>
  <text x="765" y="270" fill="#8A7440" font-size="7.5" text-anchor="middle">one Chunk per workshop document</text>

  <!-- The connection between both layers -->
  <line x1="485" y1="346" x2="485" y2="257" stroke="#2E6DB4" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="497" y="303" width="86" height="18" rx="9" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1"/>
  <text x="540" y="315" fill="#1F4E86" font-size="7.5" font-weight="700" text-anchor="middle">FROM_CHUNK</text>
  <text x="593" y="315" fill="#5C6470" font-size="7.5">links facts to their source text</text>

  <!-- Domain layer -->
  <rect x="60" y="328" width="840" height="164" rx="12" fill="#EEF4FB" stroke="#6E86CF" stroke-width="1.2"/>
  <text x="78" y="347" fill="#1F4E86" font-size="8" font-weight="700" letter-spacing="0.5">DOMAIN LAYER: CONNECTED HOTEL FACTS</text>
  <text x="882" y="347" fill="#5C6470" font-size="8" text-anchor="end">Cypher reads exact properties and follows named relationships</text>

  <!-- Relationship star, drawn below nodes -->
  <g fill="none" stroke="#2E6DB4" stroke-width="1.6">
    <line x1="480" y1="410" x2="168" y2="440" marker-end="url(#arrow-blue)"/>
    <line x1="480" y1="410" x2="374" y2="440" marker-end="url(#arrow-blue)"/>
    <line x1="480" y1="410" x2="586" y2="440" marker-end="url(#arrow-blue)"/>
    <line x1="480" y1="410" x2="792" y2="440" marker-end="url(#arrow-blue)"/>
  </g>

  <rect x="324" y="354" width="312" height="58" rx="11" fill="#2E6DB4" stroke="#1F4E86" stroke-width="1.6"/>
  <text x="480" y="378" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">(:Hotel)</text>
  <text x="480" y="397" fill="#DEEAF6" font-size="8.5" text-anchor="middle" font-family="Menlo, monospace">name · address · guest_rating</text>

  <g>
    <rect x="76" y="442" width="184" height="38" rx="9" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.3"/>
    <text x="168" y="457" fill="#5C6470" font-size="7.3" font-weight="700" text-anchor="middle">HAS_ROOM</text>
    <text x="168" y="472" fill="#1F4E86" font-size="10.5" font-weight="700" text-anchor="middle">(:Room)</text>
  </g>
  <g>
    <rect x="282" y="442" width="184" height="38" rx="9" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.3"/>
    <text x="374" y="457" fill="#5C6470" font-size="7.3" font-weight="700" text-anchor="middle">OFFERS_AMENITY</text>
    <text x="374" y="472" fill="#1F4E86" font-size="10.5" font-weight="700" text-anchor="middle">(:Amenity)</text>
  </g>
  <g>
    <rect x="494" y="442" width="184" height="38" rx="9" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.3"/>
    <text x="586" y="457" fill="#5C6470" font-size="7.3" font-weight="700" text-anchor="middle">HAS_POLICY</text>
    <text x="586" y="472" fill="#1F4E86" font-size="10.5" font-weight="700" text-anchor="middle">(:Policy)</text>
  </g>
  <g>
    <rect x="700" y="442" width="184" height="38" rx="9" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.3"/>
    <text x="792" y="457" fill="#5C6470" font-size="7.3" font-weight="700" text-anchor="middle">PROVIDES_SERVICE</text>
    <text x="792" y="472" fill="#1F4E86" font-size="10.5" font-weight="700" text-anchor="middle">(:Service)</text>
  </g>
</svg>
