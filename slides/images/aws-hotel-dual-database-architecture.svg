  <rect x="178" y="842" width="1244" height="40" rx="20" fill="#17233A"/>
  <text x="800" y="868" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Athena analyzes tables in Amazon S3. Neo4j traverses relationships and returns grounded context.</text>
