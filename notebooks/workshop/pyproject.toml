[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.24.0",
    "neo4j-graphrag>=1.6.0",
    "numpy>=2.0.0",
    "boto3>=1.38.0",
    "botocore>=1.38.0",
    "python-dotenv>=1.0.0",
    "strands-agents>=1.27.0",
]

# `workshop`'s own __init__.py lives next to this file, not under a nested
# `workshop/workshop/` directory, so package discovery needs the explicit
# package-dir mapping below rather than the usual src-layout default.
# `workshop.fixtures` is listed alongside `workshop` because setuptools
# treats any directory as an importable namespace package and warns if one
# is left out of `packages` -- it has no __init__.py and holds no .py files,
# so nothing actually imports it as `workshop.fixtures`.
[tool.setuptools]
packages = ["workshop", "workshop.fixtures"]
package-dir = {"workshop" = "."}
include-package-data = true

# `fixtures/` has no __init__.py — it is a data directory read via
# importlib.resources, not a subpackage. Without this, the wheel omits
# hotel_ids.json and workshop.fixtures.MANIFEST_PATH breaks at runtime.
[tool.setuptools.package-data]
workshop = ["fixtures/*.json"]
